services:
  postgres:
    image: postgres:16
    container_name: ai-chat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ai_chat_user
      POSTGRES_PASSWORD: ai_chat_password
      POSTGRES_DB: ai_chat_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: